name: CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: [self-hosted, Windows, X64, auras-orbit]
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Apply pinned CloudStream episode date fixes
      shell: pwsh
      run: .\.github\scripts\apply-cloudstream-episode-dates.ps1

    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

    - name: Fetch and verify pinned MPV runtime and notices
      shell: pwsh
      run: .\.github\scripts\fetch-mpv.ps1

    - name: Verify Kotlin and Gradle formatting
      run: .\gradlew.bat spotlessCheck --no-daemon

    - name: Run JVM tests
      timeout-minutes: 20
      run: .\gradlew.bat test :library:jvmTest --no-daemon --console=plain --stacktrace --info --max-workers=2

    - name: Run native tests
      timeout-minutes: 10
      run: .\gradlew.bat :desktop-app:nativeTest --no-daemon --console=plain --stacktrace --max-workers=2

    - name: Build portable app
      timeout-minutes: 20
      run: .\gradlew.bat :desktop-app:createDistributable -PorbitDistribution=tester --no-daemon --console=plain --stacktrace --max-workers=2

    - name: Verify distribution version and notices
      shell: pwsh
      run: .\.github\scripts\verify-distribution.ps1

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-reports
        path: |
          common/build/reports/tests/
          desktop-app/build/reports/tests/
          plugin-runtime/build/reports/tests/
          player-abstraction/build/reports/tests/
