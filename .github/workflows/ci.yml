name: CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && '["self-hosted", "Windows", "X64", "auras-orbit"]' || '"windows-latest"') }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

    - name: Fetch and verify pinned MPV runtime and notices
      shell: pwsh
      run: .\.github\scripts\fetch-mpv.ps1

    - name: Verify Kotlin and Gradle formatting
      run: .\gradlew.bat spotlessCheck --no-daemon

    - name: Run JVM tests
      timeout-minutes: 20
      run: .\gradlew.bat test --no-daemon --console=plain --stacktrace --info --max-workers=2

    - name: Run native tests
      timeout-minutes: 10
      run: .\gradlew.bat :desktop-app:nativeTest --no-daemon --console=plain --stacktrace --max-workers=2

    - name: Build portable app
      timeout-minutes: 20
      run: .\gradlew.bat :desktop-app:createDistributable -PorbitDistribution=tester --no-daemon --console=plain --stacktrace --max-workers=2

    - name: Verify distribution version and notices
      shell: pwsh
      run: .\.github\scripts\verify-distribution.ps1

    - name: Zip portable app
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $package = Join-Path $env:GITHUB_WORKSPACE 'desktop-app/build/compose/binaries/main/app/Auras-Orbit'
        $archive = Join-Path $env:RUNNER_TEMP "Auras-Orbit-Portable-$env:GITHUB_SHA.zip"
        [System.IO.Compression.ZipFile]::CreateFromDirectory($package, $archive, [System.IO.Compression.CompressionLevel]::Optimal, $true)

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: test-reports
        path: |
          common/build/reports/tests/
          desktop-app/build/reports/tests/
          plugin-runtime/build/reports/tests/
          player-abstraction/build/reports/tests/

    - name: Upload portable tester ZIP
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: Auras-Orbit-Portable-${{ github.sha }}
        path: ${{ runner.temp }}/Auras-Orbit-Portable-${{ github.sha }}.zip
        if-no-files-found: error
        retention-days: 14
