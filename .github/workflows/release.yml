name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v0.1.2, v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Verify Tag is on main
      shell: bash
      run: |
        git fetch origin main
        main_sha="$(git rev-parse FETCH_HEAD)"
        if [ "$main_sha" != "$GITHUB_SHA" ]; then
          echo "Release tags must point to the current main commit. Aborting release."
          exit 1
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

    - name: Set installer version from release tag
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF_NAME.Substring(1)
        if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
          throw "Release tag must contain a numeric version after the v prefix: $env:GITHUB_REF_NAME"
        }
        $sourceVersionLine = Get-Content .\gradle.properties | Where-Object { $_ -match '^APP_VERSION=' } | Select-Object -First 1
        if ($null -eq $sourceVersionLine -or ($sourceVersionLine -split '=', 2)[1].Trim() -ne $version) {
          throw "Release tag $env:GITHUB_REF_NAME does not match APP_VERSION in gradle.properties."
        }

    - name: Fetch and verify pinned MPV runtime and notices
      shell: pwsh
      run: .\.github\scripts\fetch-mpv.ps1

    - name: Verify Kotlin and Gradle formatting
      shell: pwsh
      run: .\gradlew.bat spotlessCheck --no-daemon

    - name: Run JVM tests
      timeout-minutes: 20
      shell: pwsh
      run: .\gradlew.bat test :library:jvmTest --no-daemon --console=plain --stacktrace --info --max-workers=2

    - name: Run native tests
      timeout-minutes: 10
      shell: pwsh
      run: .\gradlew.bat :desktop-app:nativeTest --no-daemon --console=plain --stacktrace --max-workers=2

    - name: Build App (createDistributable)
      timeout-minutes: 20
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF_NAME.Substring(1)
        .\gradlew.bat :desktop-app:createDistributable "-PAPP_VERSION=$version" -PorbitDistribution=release --no-daemon --console=plain --stacktrace --max-workers=2

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-test-reports
        path: |
          common/build/reports/tests/
          desktop-app/build/reports/tests/
          plugin-runtime/build/reports/tests/
          player-abstraction/build/reports/tests/

    - name: Verify portable distribution version and notices
      shell: pwsh
      run: |
        $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
        .\.github\scripts\verify-distribution.ps1 -ExpectedVersion $expectedVersion

    - name: Set up JDK 17 for Android
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build and verify Android APK
      timeout-minutes: 30
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF_NAME.Substring(1)
        Push-Location android-reference
        try {
          .\gradlew.bat :app:assembleStableDebug "-PAPP_VERSION=$version" --no-daemon --console=plain --stacktrace --max-workers=2
          if ($LASTEXITCODE -ne 0) { throw "Android APK build failed with exit code $LASTEXITCODE." }
        } finally {
          Pop-Location
        }

        $apk = "android-reference\app\build\outputs\apk\stable\debug\app-stable-debug.apk"
        .\.github\scripts\verify-android-apk.ps1 -ExpectedVersion $version -ApkPath $apk
        $releaseApk = "desktop-app\build\outputs\Auras-Orbit-Android-$version-debug.apk"
        New-Item -ItemType Directory -Force -Path (Split-Path -Parent $releaseApk) | Out-Null
        Copy-Item -LiteralPath $apk -Destination $releaseApk

    - name: Install Inno Setup
      run: choco install innosetup --yes

    - name: Compile Installer with Inno Setup
      shell: pwsh
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        & $iscc "installer\setup.iss"
        if ($LASTEXITCODE -ne 0) {
          throw "Inno Setup failed with exit code $LASTEXITCODE."
        }

        $installerPath = "desktop-app\build\outputs\Auras-Orbit-Setup.exe"
        if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
          throw "Inno Setup completed but the expected installer was not found: $installerPath"
        }
        $installer = Get-Item -LiteralPath $installerPath
        Write-Host "Installer verified: $($installer.FullName) ($($installer.Length) bytes)"
        $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
        .\.github\scripts\verify-distribution.ps1 -ExpectedVersion $expectedVersion -RequireInstaller

    - name: Archive portable distribution
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF_NAME.Substring(1)
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $package = Join-Path $env:GITHUB_WORKSPACE 'desktop-app/build/compose/binaries/main/app/Auras-Orbit'
        $archive = Join-Path $env:GITHUB_WORKSPACE "desktop-app/build/outputs/Auras-Orbit-Portable-$version.zip"
        [System.IO.Compression.ZipFile]::CreateFromDirectory($package, $archive, [System.IO.Compression.CompressionLevel]::Optimal, $true)

    - name: Publish Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          desktop-app/build/outputs/Auras-Orbit-Setup.exe
          desktop-app/build/outputs/Auras-Orbit-Portable-*.zip
          desktop-app/build/outputs/Auras-Orbit-Android-*-debug.apk
        generate_release_notes: true
        prerelease: true
