name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v0.1.2, v1.0.0
      # Rewritten historical tags must not start a release build for an old commit.
      - '!v0.2.0.23'
      - '!v0.2.0.24'
      - '!v0.2.0.25'
      - '!v0.2.0.26'
      - '!v1.0.0.00'
      - '!v1.0.0.01'
      - '!v1.0.0.02'
      - '!v1.0.0.03'
      - '!v1.0.0.04'
      - '!v1.0.0.05'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Verify Tag is on main
      id: verify-release-tag
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        "allow_stable_rerun=false" >> $env:GITHUB_OUTPUT
        git fetch origin main
        if ($LASTEXITCODE -ne 0) {
          throw 'Could not fetch main to verify the release tag.'
        }
        $mainSha = (& git rev-parse FETCH_HEAD).Trim()
        if ($LASTEXITCODE -ne 0) {
          throw 'Could not resolve the fetched main commit.'
        }
        $tagPointsToCurrentMain = $mainSha -ceq $env:GITHUB_SHA
        if (-not $tagPointsToCurrentMain) {
          git merge-base --is-ancestor $env:GITHUB_SHA $mainSha
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tags must point to the current main commit, except for a rerun of an already-published stable release whose commit remains on main.'
          }
        }

        $tag = [uri]::EscapeDataString($env:GITHUB_REF_NAME)
        $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
        $headers = @{
          Accept = 'application/vnd.github+json'
          'X-GitHub-Api-Version' = '2022-11-28'
          Authorization = "Bearer $env:GITHUB_TOKEN"
          'User-Agent' = 'Auras-Orbit-release-rerun-gate'
        }
        $existingRelease = $null
        try {
          $existingRelease = Invoke-RestMethod -Uri $releaseUri -Headers $headers -Method Get
        } catch {
          if (-not $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 404) {
            throw
          }
        }
        if ($null -eq $existingRelease) {
          if (-not $tagPointsToCurrentMain) {
            throw 'A tag behind main can run only when GitHub already has its stable release; refusing an old or unpublished tag.'
          }
          Write-Host 'New release tag points to the current main commit.'
          exit 0
        }

        if ($existingRelease.tag_name -cne $env:GITHUB_REF_NAME -or
            $existingRelease.draft -or $existingRelease.prerelease) {
          throw 'An existing release must be the exact matching stable, non-draft, non-prerelease release.'
        }

        $runAttempt = 0
        if (-not [int]::TryParse($env:GITHUB_RUN_ATTEMPT, [ref]$runAttempt) -or $runAttempt -le 1) {
          throw 'An existing stable release can run only on a GitHub Actions rerun of the original tag event.'
        }

        $tagRef = "refs/tags/$env:GITHUB_REF_NAME"
        $peeledTagRef = "$tagRef^{}"
        $remoteTagLines = @(& git ls-remote origin $tagRef $peeledTagRef)
        if ($LASTEXITCODE -ne 0) {
          throw 'Could not verify the release tag against origin.'
        }
        $peeledTagLine = $remoteTagLines |
          Where-Object { $_ -match "\s$([regex]::Escape($peeledTagRef))$" } |
          Select-Object -First 1
        if ($peeledTagLine) {
          $remoteTagCommit = ($peeledTagLine -split '\s+', 2)[0]
        } else {
          $lightweightTagLine = $remoteTagLines |
            Where-Object { $_ -match "\s$([regex]::Escape($tagRef))$" } |
            Select-Object -First 1
          if (-not $lightweightTagLine) {
            throw "Remote tag '$env:GITHUB_REF_NAME' was not found."
          }
          $remoteTagCommit = ($lightweightTagLine -split '\s+', 2)[0]
        }
        if ($remoteTagCommit -cne $env:GITHUB_SHA) {
          throw "Remote tag '$env:GITHUB_REF_NAME' now resolves to $remoteTagCommit instead of the original workflow commit $env:GITHUB_SHA."
        }

        if ($tagPointsToCurrentMain) {
          Write-Host "Allowing rerun of published stable release $($existingRelease.tag_name) at $env:GITHUB_SHA; it still points to current main."
        } else {
          Write-Host "Allowing rerun of published stable release $($existingRelease.tag_name) at $env:GITHUB_SHA; its commit is still an ancestor of main."
        }
        "allow_stable_rerun=true" >> $env:GITHUB_OUTPUT

    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - name: Set installer version from release tag
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERIFIED_STABLE_RELEASE_RERUN: ${{ steps.verify-release-tag.outputs.allow_stable_rerun }}
      run: |
        $version = $env:GITHUB_REF_NAME.Substring(1)
        if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
          throw "Release tag must contain a numeric version after the v prefix: $env:GITHUB_REF_NAME"
        }
        git ls-files --error-unmatch android/gradle.properties *> $null
        if ($LASTEXITCODE -ne 0) {
          throw 'The Android project must be committed before a release tag can build it.'
        }
        $orbitVersionLine = Get-Content .\android\gradle.properties | Where-Object { $_ -match '^ORBIT_RELEASE_VERSION_NAME=' } | Select-Object -First 1
        if ($null -eq $orbitVersionLine -or ($orbitVersionLine -split '=', 2)[1].Trim() -ne $version) {
          throw "Release tag $env:GITHUB_REF_NAME does not match ORBIT_RELEASE_VERSION_NAME in android/gradle.properties."
        }
        $allowPublishedStableRerun = $env:VERIFIED_STABLE_RELEASE_RERUN -ceq 'true'
        .\.github\scripts\verify-android-release-version.ps1 -ExpectedVersion $version -Repository $env:GITHUB_REPOSITORY -AllowPublishedStableRerun:$allowPublishedStableRerun

    - name: Fetch and verify pinned MPV runtime and notices
      shell: pwsh
      run: .\.github\scripts\fetch-mpv.ps1

    - name: Verify Kotlin and Gradle formatting
      shell: pwsh
      run: .\gradlew.bat spotlessCheck --no-daemon

    - name: Run JVM tests
      timeout-minutes: 20
      shell: pwsh
      run: .\gradlew.bat test :library:jvmTest --no-daemon --console=plain --stacktrace --info --max-workers=2

    - name: Run native tests
      timeout-minutes: 10
      shell: pwsh
      run: .\gradlew.bat :desktop-app:nativeTest --no-daemon --console=plain --stacktrace --max-workers=2

    - name: Build App (createDistributable)
      timeout-minutes: 20
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF_NAME.Substring(1)
        .\gradlew.bat :desktop-app:createDistributable "-PAPP_VERSION=$version" -PorbitDistribution=release --no-daemon --console=plain --stacktrace --max-workers=2

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-test-reports
        path: |
          common/build/reports/tests/
          desktop-app/build/reports/tests/
          plugin-runtime/build/reports/tests/
          player-abstraction/build/reports/tests/

    - name: Verify portable distribution version and notices
      shell: pwsh
      run: |
        $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
        .\.github\scripts\verify-distribution.ps1 -ExpectedVersion $expectedVersion

    - name: Set up JDK 17 for Android
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK and pinned NDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: 'ndk;28.2.13676358'

    - name: Build and verify Android APK
      timeout-minutes: 30
      shell: pwsh
      env:
        AURAS_RELEASE_KEYSTORE_BASE64: ${{ secrets.AURAS_RELEASE_KEYSTORE_BASE64 }}
        AURAS_RELEASE_STORE_PASSWORD: ${{ secrets.AURAS_RELEASE_STORE_PASSWORD }}
        AURAS_RELEASE_KEY_ALIAS: ${{ secrets.AURAS_RELEASE_KEY_ALIAS }}
        AURAS_RELEASE_KEY_PASSWORD: ${{ secrets.AURAS_RELEASE_KEY_PASSWORD }}
      run: |
        $version = $env:GITHUB_REF_NAME.Substring(1)
        if ([string]::IsNullOrWhiteSpace($env:AURAS_RELEASE_KEYSTORE_BASE64)) {
          throw 'The stable Android release signing keystore is not configured.'
        }
        $keystorePath = Join-Path $env:RUNNER_TEMP 'auras-orbit-release.p12'
        $keystoreBytes = [Convert]::FromBase64String($env:AURAS_RELEASE_KEYSTORE_BASE64)
        [System.IO.File]::WriteAllBytes($keystorePath, $keystoreBytes)
        [Array]::Clear($keystoreBytes, 0, $keystoreBytes.Length)
        $env:AURAS_RELEASE_STORE_FILE = $keystorePath
        Push-Location android
        try {
          .\gradlew.bat :app:assembleRelease "-PORBIT_RELEASE_VERSION_NAME=$version" --no-daemon --no-configuration-cache --console=plain --stacktrace --max-workers=2
          if ($LASTEXITCODE -ne 0) { throw "Orbit Android APK build failed with exit code $LASTEXITCODE." }
        } finally {
          Pop-Location
        }

        $releaseDirectory = "android\app\build\outputs\apk\release"
        $releaseApks = @(Get-ChildItem -LiteralPath $releaseDirectory -Filter "*.apk" -File)
        if ($releaseApks.Count -ne 1) {
          throw "Expected one Orbit release APK in $releaseDirectory; found $($releaseApks.Count)."
        }
        $apk = $releaseApks[0].FullName
        .\.github\scripts\verify-android-apk.ps1 -ExpectedVersion $version -ApkPath $apk
        $releaseOutput = "desktop-app\build\outputs"
        New-Item -ItemType Directory -Force -Path $releaseOutput | Out-Null
        # The legacy Android updater discovers stable APKs from numeric asset names.
        Copy-Item -LiteralPath $apk -Destination (Join-Path $releaseOutput "$version.apk")
        Copy-Item -LiteralPath $apk -Destination (Join-Path $releaseOutput "Auras-Orbit.apk")

    - name: Install Inno Setup
      run: choco install innosetup --yes

    - name: Compile Installer with Inno Setup
      shell: pwsh
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        & $iscc "installer\setup.iss"
        if ($LASTEXITCODE -ne 0) {
          throw "Inno Setup failed with exit code $LASTEXITCODE."
        }

        $installerPath = "desktop-app\build\outputs\Auras-Orbit-Setup.exe"
        if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
          throw "Inno Setup completed but the expected installer was not found: $installerPath"
        }
        $installer = Get-Item -LiteralPath $installerPath
        Write-Host "Installer verified: $($installer.FullName) ($($installer.Length) bytes)"
        $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
        .\.github\scripts\verify-distribution.ps1 -ExpectedVersion $expectedVersion -RequireInstaller

    - name: Archive portable distribution
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF_NAME.Substring(1)
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $package = Join-Path $env:GITHUB_WORKSPACE 'desktop-app/build/compose/binaries/main/app/Auras-Orbit'
        $archive = Join-Path $env:GITHUB_WORKSPACE "desktop-app/build/outputs/Auras-Orbit-Portable-$version.zip"
        [System.IO.Compression.ZipFile]::CreateFromDirectory($package, $archive, [System.IO.Compression.CompressionLevel]::Optimal, $true)

    - name: Publish Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          desktop-app/build/outputs/Auras-Orbit-Setup.exe
          desktop-app/build/outputs/Auras-Orbit-Portable-*.zip
          desktop-app/build/outputs/*.apk
        generate_release_notes: true
        prerelease: false
        # On reruns, preserve existing release assets and upload only missing files.
        overwrite_files: false
