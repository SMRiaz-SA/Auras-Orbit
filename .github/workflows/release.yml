name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v0.1.2, v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Verify Tag is on main
      shell: bash
      run: |
        git fetch origin main
        if ! git branch -r --contains ${{ github.sha }} | grep -q 'origin/main'; then
          echo "Release tags must point to a commit on main. Aborting release."
          exit 1
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

    - name: Set installer version from release tag
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF_NAME.Substring(1)
        if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
          throw "Release tag must contain a numeric version after the v prefix: $env:GITHUB_REF_NAME"
        }

    - name: Fetch and verify pinned MPV runtime and notices
      shell: pwsh
      run: .\.github\scripts\fetch-mpv.ps1

    - name: Verify Kotlin and Gradle formatting
      shell: pwsh
      run: .\gradlew.bat spotlessCheck --no-daemon

    - name: Build App (createDistributable)
      shell: bash
      run: |
        # Extract version from tag (e.g., v0.1.4 -> 0.1.4)
        VERSION=${GITHUB_REF_NAME#v}
        ./gradlew test :desktop-app:nativeTest :desktop-app:createDistributable -PAPP_VERSION=$VERSION -PorbitDistribution=release --no-daemon

    - name: Verify portable distribution version and notices
      shell: pwsh
      run: |
        $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
        .\.github\scripts\verify-distribution.ps1 -ExpectedVersion $expectedVersion

    - name: Install Inno Setup
      run: choco install innosetup --yes

    - name: Compile Installer with Inno Setup
      shell: pwsh
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        & $iscc "installer\setup.iss"
        if ($LASTEXITCODE -ne 0) {
          throw "Inno Setup failed with exit code $LASTEXITCODE."
        }

        $installerPath = "desktop-app\build\outputs\Auras-Orbit-Setup.exe"
        if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
          throw "Inno Setup completed but the expected installer was not found: $installerPath"
        }
        $installer = Get-Item -LiteralPath $installerPath
        Write-Host "Installer verified: $($installer.FullName) ($($installer.Length) bytes)"
        $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
        .\.github\scripts\verify-distribution.ps1 -ExpectedVersion $expectedVersion -RequireInstaller

    - name: Archive portable distribution
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF_NAME.Substring(1)
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $package = Join-Path $env:GITHUB_WORKSPACE 'desktop-app/build/compose/binaries/main/app/Auras-Orbit'
        $archive = Join-Path $env:GITHUB_WORKSPACE "desktop-app/build/outputs/Auras-Orbit-Portable-$version.zip"
        [System.IO.Compression.ZipFile]::CreateFromDirectory($package, $archive, [System.IO.Compression.CompressionLevel]::Optimal, $true)

    - name: Publish Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          desktop-app/build/outputs/Auras-Orbit-Setup.exe
          desktop-app/build/outputs/Auras-Orbit-Portable-*.zip
        generate_release_notes: true
        prerelease: true
