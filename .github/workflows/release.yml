name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v0.1.2, v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Verify Tag is on main
      shell: bash
      run: |
        git fetch origin main
        if ! git branch -r --contains ${{ github.sha }} | grep -q 'origin/main'; then
          echo "Release tags must point to a commit on main. Aborting release."
          exit 1
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Set installer version from release tag
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF_NAME.Substring(1)
        if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
          throw "Release tag must contain a numeric version after the v prefix: $env:GITHUB_REF_NAME"
        }
        $versionLine = '#define AppVersion "' + $version + '"'
        Set-Content -LiteralPath installer/version.iss -Value $versionLine -NoNewline

    - name: Fetch and verify pinned MPV runtime and notices
      shell: pwsh
      run: .\.github\scripts\fetch-mpv.ps1

    - name: Build App (createDistributable)
      shell: bash
      run: |
        # Extract version from tag (e.g., v0.1.4 -> 0.1.4)
        VERSION=${GITHUB_REF_NAME#v}
        ./gradlew :desktop-app:createDistributable -PAPP_VERSION=$VERSION -PorbitDistribution=release --no-daemon

    - name: Verify portable distribution version and notices
      shell: pwsh
      run: |
        $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
        .\.github\scripts\verify-distribution.ps1 -ExpectedVersion $expectedVersion

    - name: Install Inno Setup
      run: choco install innosetup --yes

    - name: Compile Installer with Inno Setup
      shell: pwsh
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        & $iscc "installer\setup.iss"
        if ($LASTEXITCODE -ne 0) {
          throw "Inno Setup failed with exit code $LASTEXITCODE."
        }

        $installerPath = "desktop-app\build\outputs\Auras-Orbit-Setup.exe"
        if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
          throw "Inno Setup completed but the expected installer was not found: $installerPath"
        }
        $installer = Get-Item -LiteralPath $installerPath
        Write-Host "Installer verified: $($installer.FullName) ($($installer.Length) bytes)"
        $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
        .\.github\scripts\verify-distribution.ps1 -ExpectedVersion $expectedVersion -RequireInstaller

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        files: desktop-app/build/outputs/Auras-Orbit-Setup.exe
        generate_release_notes: true
        prerelease: true
